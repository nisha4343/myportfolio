
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="A simple task manager to add, edit, complete, and organize your daily tasks.">
    <meta name="author" content="Portfolio Developer">

    <title>TaskFlow | To-Do List</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <div class="container header-content">
            <a href="index.html" class="logo">TaskFlow<span>.</span></a>
            <p class="header-caption">Make today count.</p>
        </div>
    </header>

    <main class="container">
        <section class="todo-app" aria-labelledby="page-title">
            <div class="intro">
                <p class="eyebrow">YOUR DAILY PLANNER</p>
                <h1 id="page-title">Get things done.</h1>
                <p class="subtitle">Small steps lead to big achievements.</p>
            </div>

            <form id="task-form" class="task-form">
                <label for="task-input">What do you need to do?</label>

                <div class="input-row">
                    <input
                        type="text"
                        id="task-input"
                        name="task"
                        placeholder="Enter your next task..."
                        maxlength="200"
                        autocomplete="off"
                        required
                    >

                    <button type="submit" class="add-button">
                        + Add task
                    </button>
                </div>
            </form>

            <div class="task-summary">
                <div>
                    <h2>My tasks</h2>
                    <p id="task-count" aria-live="polite">0 tasks remaining</p>
                </div>

                <button type="button" id="clear-completed" class="text-button">
                    Clear completed
                </button>
            </div>

            <div
                class="filters"
                id="filter-group"
                role="group"
                aria-label="Filter tasks"
            >
                <button
                    type="button"
                    class="filter-button active"
                    data-filter="all"
                    aria-pressed="true"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="active"
                    aria-pressed="false"
                >
                    Active
                </button>

                <button
                    type="button"
                    class="filter-button"
                    data-filter="completed"
                    aria-pressed="false"
                >
                    Completed
                </button>
            </div>

            <ul id="task-list" class="task-list" aria-label="Your tasks"></ul>

            <p id="empty-message" class="empty-message">
                No tasks yet. Add your first task above!
            </p>

            <p class="storage-note">
                Your tasks are saved automatically in this browser.
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>Built with HTML, CSS and JavaScript.</p>
    </footer>
</body>
</html>
