<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Nisha through the accessible portfolio contact form.">

    <meta name="author"
          content="Nisha">

    <title>Contact | Nisha</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <a class="skip-link" href="#main-content">
        Skip to main content
    </a>


    <header class="site-header">

        <div class="container">

            <a href="index.html"
               class="logo"
               aria-label="Nisha Portfolio Home">
                Nisha
            </a>

            <nav aria-label="Main navigation">

                <ul class="nav-list">

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="about.html">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="projects.html">
                            Projects
                        </a>
                    </li>

                    <li>
                        <a href="contact.html"
                           aria-current="page">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <main id="main-content">

        <section class="page-header"
                 aria-labelledby="page-title">

            <div class="container">

                <p class="eyebrow">
                    Let's connect
                </p>

                <h1 id="page-title">
                    Contact Me
                </h1>

            </div>

        </section>


        <section aria-labelledby="contact-heading">

            <div class="container">

                <h2 id="contact-heading">
                    Send Me a Message
                </h2>

                <p>
                    Have a question or want to connect?
                    Fill out the form below.
                </p>


                <form action="#"
                      method="post"
                      aria-label="Contact form">


                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            autocomplete="name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            autocomplete="email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="message">
                            Message
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="6"
                            required></textarea>

                    </div>


                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </div>

        </section>

    </main>


    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 Nisha. All rights reserved.
            </p>

        </div>

    </footer>

</body>

</html>
